<app-overlay class="show top">
    <button [vibrateHaptic]="10" [title]="lang.ph().faq+' (F1)'" ch-button class="tshadow"
        (click)="showHelp()">❔</button>
    <button [vibrateHaptic]="10" [title]="lang.ph().settings+' (F2)'" ch-button class="tshadow"
        (click)="showSettings()">⚙️</button>
    <separator />
    <button [vibrateHaptic]="10" [title]="lang.ph().history+ ' (Ctrl+H)'" ch-button class="tshadow"
        (click)="showHistory()">📜</button>
    <!-- <button title="Downloads" disabled ch-button class=" tshadow">📥</button>
    <button title="Library" disabled ch-button class=" tshadow">📚</button> -->
    <app-extension-button style="margin-left: auto;" />
    <app-lang-toggle />
</app-overlay>

<app-dialog #faqDialog [title]="'🙋‍♂️ ' + lang.ph().faq">
    @defer{ <app-faq /> }
</app-dialog>

<app-dialog #settingsDialog [title]="'⚙️ ' + lang.ph().settings">
    @defer{ <app-settings /> }
</app-dialog>

<app-dialog #historyDialog [title]="'📜 ' + lang.ph().history">
    @defer{ <app-history-list /> }
</app-dialog>
